command_timeout = 1000
scan_timeout = 1000
format = '$python$all$fill$time$line_break$character'

[c]
disabled = true

[cmd_duration]
disabled = true

[directory]
truncate_to_repo = false
truncation_length = 0

[fill]
symbol = ' '

[git_branch]
format = '[$branch ]($style)'

[git_status]
disabled = true

[package]
disabled = true

[python]
format = '[${pyenv_prefix}(\($virtualenv\) )]($style)'
style = 'bold blue'

[rust]
disabled = true

[status]
disabled = false
format = '[$status]($style)'

[time]
disabled = false
format = '[$time]($style)'

[username]
format = '[$user ]($style)'
show_always = true
style_user = 'bold green'
